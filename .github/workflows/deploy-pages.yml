name: Deploy DIVE ATLAS
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dive-atlas-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build:pages -- artifacts/pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
