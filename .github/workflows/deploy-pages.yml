name: Deploy DIVE ATLAS
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dive-atlas-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Keep npm cache outside the checkout
        run: printf 'npm_config_cache=%s\n' "$RUNNER_TEMP/dive-atlas-npm" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Load approved public journal
        env:
          DIVE_ATLAS_PUBLIC_JOURNAL: ${{ secrets.DIVE_ATLAS_PUBLIC_JOURNAL }}
        run: |
          node -e 'const journal = process.env.DIVE_ATLAS_PUBLIC_JOURNAL; if (journal) require("node:fs").writeFileSync("public-journal.json", journal);'
      - name: Verify the release tree
        run: |
          git status --short
          test -z "$(git status --porcelain)"
      - run: npm run build:pages -- artifacts/pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
