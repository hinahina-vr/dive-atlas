<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091c26">
  <title>OWD スキルラボ | DIVE ATLAS</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="../" aria-label="DIVE ATLAS 地図へ戻る">
      <svg viewBox="0 0 38 38" aria-hidden="true"><path d="M4 22c5-8 9-8 15 0s10 8 15 0M4 15c5-8 9-8 15 0s10 8 15 0"/></svg>
      <span>DIVE ATLAS</span>
    </a>
    <span class="mast-label">FIELD LAB <b>01</b></span>
    <a class="return" href="../">地図に戻る <span aria-hidden="true">↗</span></a>
  </header>

  <main>
    <section class="intro" aria-labelledby="title">
      <div>
        <p class="eyebrow">OPEN WATER · SKILLS LAB</p>
        <h1 id="title">OWD スキルラボ</h1>
        <p>次のダイブの前に、手順を思い出そう。</p>
      </div>
      <div class="intro-controls">
        <button type="button" id="show-example" class="outline-control" aria-pressed="false">▷ 見本を見る</button>
        <div class="segmented" role="group" aria-label="練習モード">
          <button type="button" id="guided" aria-pressed="true">手順を見ながら</button>
          <button type="button" id="recall" aria-pressed="false">自力で復習</button>
        </div>
      </div>
    </section>

    <nav id="lessons" aria-label="練習メニュー"></nav>

    <section class="workspace" aria-label="練習">
      <div class="viewer">
        <div class="viewport" id="viewport">
        <div id="scene" aria-label="3D器材モデル"></div>
        <div class="view-title">
          <p class="eyebrow" id="view-label"></p>
          <p id="view-subtitle"></p>
        </div>
        <div id="mask-overlay" aria-hidden="true" hidden>
          <div class="mask-window"><span></span></div>
          <div class="mask-window"><span></span></div>
        </div>
        <button type="button" id="perspective" aria-pressed="false" hidden>ダイバー視点</button>
        <p id="grip-label" hidden></p>
        <div id="effect-meter" aria-hidden="true" hidden><span></span><i></i></div>
        <p id="scene-feedback" aria-hidden="true" hidden></p>
        <div id="hotspots"></div>
        <div id="dock-markers"></div>
        <svg id="example-guide" aria-hidden="true" hidden>
          <line></line><circle r="11"></circle><circle r="15"></circle>
        </svg>
        <div id="example-caption" aria-hidden="true" hidden><span></span><strong></strong></div>
        <div class="view-controls" role="group" aria-label="カメラ操作">
          <button type="button" id="rotate-left" aria-label="左に回す" title="左に回す">↶</button>
          <button type="button" id="reset-view" aria-label="視点を戻す" title="視点を戻す">⌖</button>
          <button type="button" id="rotate-right" aria-label="右に回す" title="右に回す">↷</button>
        </div>
        <p id="view-help">ドラッグで回転</p>
        </div>
        <div id="example-controls" hidden>
          <div class="example-timer" aria-hidden="true"><i></i></div>
          <div class="example-transport" role="group" aria-label="見本の再生">
            <button type="button" id="example-prev" class="outline-control">‹ 前へ</button>
            <button type="button" id="example-play" class="outline-control">一時停止</button>
            <button type="button" id="example-next" class="outline-control">次へ ›</button>
          </div>
          <button type="button" id="example-recall" class="primary">ヒントなしで試す ›</button>
          <button type="button" id="example-exit" class="quiet">練習に戻る</button>
        </div>
      </div>

      <section class="panel" aria-labelledby="lesson-title">
        <div class="panel-top">
          <p class="eyebrow" id="module-label"></p>
          <span id="step-count"></span>
        </div>
        <div class="progress" id="progress" role="progressbar" aria-label="練習の進み具合" aria-valuemin="0"></div>
        <h2 id="lesson-title"></h2>
        <p id="lesson-description" class="description"></p>
        <div id="instruction">
          <p class="step-label" id="step-label"></p>
          <p class="step-title" id="step-title"></p>
          <p class="step-description" id="step-description"></p>
        </div>
        <div id="choices" role="group" aria-label="操作を選ぶ"></div>
        <div id="placement-menu" role="group" aria-label="取り付け先を選ぶ" hidden></div>
        <p id="feedback" role="status" aria-live="polite"></p>
        <div id="result" hidden>
          <p class="result-heading" id="result-heading"></p>
          <ul id="review"></ul>
          <button type="button" id="next-lesson" class="primary" hidden></button>
        </div>
        <details id="previous-review" hidden>
          <summary><span>前回の自力復習</span><span id="previous-review-count"></span></summary>
          <ul id="previous-review-list"></ul>
        </details>
        <div class="panel-footer" id="practice-footer">
          <button type="button" id="hint" class="quiet">ヒントを見る</button>
          <button type="button" id="reset" class="quiet">最初から</button>
        </div>
      </section>
    </section>

    <footer class="footnote">
      <p>認定後の復習用です。実機では講習で習った手順と、使う器材の説明書を確認してください。水中の実技はインストラクターと復習できます。</p>
      <a id="source-link" target="_blank" rel="noreferrer">参照した資料 ↗</a>
    </footer>
  </main>
</body>
</html>
